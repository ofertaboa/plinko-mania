# Netlify — site 100% estatico (HTML/JS/CSS/imagens/audios/videos locais)
# Publique arrastando a pasta em app.netlify.com ou conectando o repositorio.
# Redirects / headers estao no arquivo _redirects (lido automaticamente).
#
# ATENCAO: o repositorio esta com base path /plinko-mania (GitHub Pages).
# Para o Netlify (raiz) rode antes:  node tools\rebase.js --root

[build]
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Cada rota já existe como arquivo estático real (raiz do domínio):
#   /                  -> index.html
#   /jogar             -> jogar/index.html
#   /salas             -> salas/index.html
#   /missoes           -> missoes/index.html
#   /premios           -> premios/index.html
#   /depositar         -> depositar/index.html
#   /sacar             -> sacar/index.html
#   /extrato           -> extrato/index.html
#   /perfil            -> perfil/index.html
#   /indique           -> indique/index.html
#   /cadastrar         -> cadastrar/index.html
#   /entrar            -> entrar/index.html
#   /sobre /termos /privacidade /suporte /jogo-responsavel /seguranca
#   qualquer outra rota -> 404.html (com botão "Acessar agora")
